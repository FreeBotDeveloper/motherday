<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Mother's Day - 3D Experience</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Premium Preloader -->
    <div id="preloader">
        <div class="loader-content">
            <div class="loader-circle"></div>
            <div class="loader-text"><span id="load-progress">0</span>%</div>
        </div>
    </div>

    <!-- Fog Wiping Hint -->
    <div id="fog-hint" class="overlay">
        <h2 class="instruction-text" data-th="👆 เช็ดกระจกเพื่อเปิดอ่าน..." data-en="👆 Wipe the glass to read...">👆 เช็ดกระจกเพื่อเปิดอ่าน...</h2>
    </div>

    <!-- Cinematic Vignette -->
    <div id="vignette"></div>

    <!-- Star Counter (Hidden by default) -->
    <div id="star-counter">⭐ 0/5</div>

    <!-- Custom Magnetic Cursor -->
    <div id="cursor"></div>
    <div id="cursor-follower"></div>

    <!-- Floating 3D Polaroids -->
    <div id="polaroids-container" class="polaroids-container">
        <div class="polaroid" id="pol-1">
            <div class="polaroid-img" style="background-image: url('https://images.unsplash.com/photo-1492725764893-90b379c2b6e7?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80');"></div>
            <div class="polaroid-caption">Mom & Me ❤️</div>
        </div>
        <div class="polaroid" id="pol-2">
            <div class="polaroid-img" style="background-image: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80');"></div>
            <div class="polaroid-caption">Happy Times</div>
        </div>
        <div class="polaroid" id="pol-3">
            <div class="polaroid-img" style="background-image: url('https://images.unsplash.com/photo-1542037104857-ffcb0b011409?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80');"></div>
            <div class="polaroid-caption">Family ✨</div>
        </div>
    </div>

    <!-- 3D WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Music Controls -->
    <div class="music-controls" id="music-player-widget">
        <button id="music-toggle-btn" class="glass-btn icon-btn">
            <i class="fas fa-compact-disc"></i>
        </button>
        <div class="music-panel">
            <div class="music-info">
                <span class="music-title">Background Music</span>
                <span class="music-time" id="music-time-display">0:00 / 0:00</span>
            </div>
            <input type="range" id="music-progress" class="styled-slider" min="0" max="100" value="0">
            <div class="volume-control">
                <button id="mute-btn" class="glass-btn tiny-btn"><i class="fas fa-volume-up"></i></button>
                <input type="range" id="volume-slider" class="styled-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
    </div>

    <!-- Language Toggle -->
    <div class="lang-controls">
        <button id="lang-th" class="lang-btn active">TH</button>
        <button id="lang-en" class="lang-btn">EN</button>
    </div>

    <!-- Start Overlay (Next Button) -->
    <div id="start-overlay" class="overlay active">
        <button id="read-btn" class="glass-btn">
            <span data-th="เปิดอ่านจดหมาย" data-en="Open Letter">เปิดอ่านจดหมาย</span>
        </button>
    </div>

    <!-- 3D Card Scene -->
    <div id="card-scene" class="overlay-3d">
        <div class="card-container" id="the-card">
            <!-- Right side (Inside content) -->
            <div class="card-page card-right">
                <div class="card-inner-content">
                    <p id="magic-msg" class="magic-msg"></p>
                    <div class="signature" data-th="ด้วยรักอย่างยิ่ง..." data-en="With all my love...">ด้วยรักอย่างยิ่ง...</div>
                    <button id="fireworks-btn" class="glass-btn small-btn">
                        <span data-th="เฉลิมฉลอง 🎉" data-en="Celebrate 🎉">เฉลิมฉลอง 🎉</span>
                    </button>
                </div>
                <button id="close-btn" class="close-btn">✖</button>
            </div>
            
            <!-- Left side (Cover that flips) -->
            <div class="card-page card-left" id="card-cover">
                <!-- Front of cover -->
                <div class="card-face cover-front">
                    <h1 class="magic-title" data-th="สุขสันต์วันแม่" data-en="Happy Mother's Day">สุขสันต์วันแม่</h1>
                    <div class="heart-seal">❤</div>
                </div>
                <!-- Back of cover (Inside left page) -->
                <div class="card-face cover-back"></div>
            </div>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="bg-music.mp3" type="audio/mpeg">
    </audio>

    <!-- Wish Button -->
    <button id="wish-trigger-btn" class="glass-btn float-bottom">
        <i class="fas fa-star"></i> <span data-th="อธิษฐาน" data-en="Make a Wish">อธิษฐาน</span>
    </button>

    <!-- Wish Modal -->
    <div id="wish-modal" class="overlay">
        <div class="wish-content">
            <h2 class="wish-title" data-th="เขียนคำอธิษฐาน" data-en="Write your wish">เขียนคำอธิษฐาน</h2>
            <p class="wish-desc" data-th="พรของคุณจะลอยขึ้นสู่ท้องฟ้า" data-en="Your blessing will float into the sky">พรของคุณจะลอยขึ้นสู่ท้องฟ้า</p>
            <textarea id="wish-input" rows="3" placeholder="พิมพ์ข้อความที่นี่..." maxlength="60"></textarea>
            <div class="wish-actions">
                <button id="close-wish-btn" class="glass-btn small-btn cancel-btn">
                    <span data-th="ยกเลิก" data-en="Cancel">ยกเลิก</span>
                </button>
                <button id="release-wish-btn" class="glass-btn small-btn">
                    <span data-th="ปล่อยโคมลอย 🏮" data-en="Release Lantern 🏮">ปล่อยโคมลอย 🏮</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Audio Metadata Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Secret Gift / Share Modal -->
    <div id="secret-gift-modal" class="overlay">
        <div class="gift-content">
            <h2 class="gift-title" data-th="✨ ยินดีด้วย!" data-en="✨ Congratulations!">✨ ยินดีด้วย!</h2>
            <p class="gift-desc" data-th="คุณปลดล็อกความลับสำเร็จแล้ว แชร์ความประทับใจนี้ให้ทุกคนรู้สิ!" data-en="You unlocked the secret! Share this beautiful moment!">คุณปลดล็อกความลับสำเร็จแล้ว แชร์ความประทับใจนี้ให้ทุกคนรู้สิ!</p>
            
            <div class="share-buttons">
                <button class="share-btn fb" id="share-fb" title="Share on Facebook"><i class="fab fa-facebook-f"></i></button>
                <button class="share-btn line" id="share-line" title="Share on LINE"><i class="fab fa-line"></i></button>
                <button class="share-btn x" id="share-x" title="Share on X (Twitter)"><i class="fab fa-x-twitter"></i></button>
                <button class="share-btn copy" id="share-copy" title="Copy Link"><i class="fas fa-link"></i></button>
            </div>
            
            <button id="close-gift-btn" class="glass-btn small-btn" style="margin-top: 30px;">
                <span data-th="เข้าสู่ฉากจบ" data-en="Enter Finale">เข้าสู่ฉากจบ</span>
            </button>
        </div>
    </div>

    <!-- Cinematic Ending -->
    <div id="cinematic-container">
        <div id="countdown-number">10</div>
        <div id="supernova-flash"></div>
        <div id="final-message">I love mom</div>
    </div>

    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
